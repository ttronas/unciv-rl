name: RL Integration Tests

on:
  push:
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: build the server JAR once and share it with all test jobs via
  # GitHub Actions artifact storage.  No Python or RL library needed here.
  # ---------------------------------------------------------------------------
  build-server-jar:
    name: Build server JAR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build server JAR
        run: ./gradlew server:dist

      - name: Upload server JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: unciv-server-jar
          path: server/build/libs/UncivServer.jar
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 2: base environment + server-communication tests.
  # Minimal Python install – no RL library packages required.
  # ---------------------------------------------------------------------------
  test-base-env:
    name: Base env & server communication tests
    needs: [build-server-jar]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Start RL server
        uses: ./.github/actions/start-rl-server

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pettingzoo gymnasium numpy requests pytest

      - name: Run env unit tests (obs parser, action mapper, spaces)
        env:
          UNCIV_RL_URL: http://localhost:8080
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest rl_env/tests/test_env.py -v

      - name: Run server communication tests
        env:
          UNCIV_RL_URL: http://localhost:8080
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest rl_env/tests/test_server_communication.py -v

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) 2>/dev/null || true
          fi

  # ---------------------------------------------------------------------------
  # Job 3: RLlib integration tests (PPO, action masking, macro wrapper).
  # Isolated Python environment – ray + torch only, no conflict with other libs.
  # To add a new RL library, copy this job, change the install step and the
  # pytest target.  The composite action handles the server setup identically.
  # ---------------------------------------------------------------------------
  test-rllib:
    name: RLlib integration tests (live server)
    needs: [build-server-jar]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Start RL server
        uses: ./.github/actions/start-rl-server

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install pettingzoo gymnasium numpy requests pytest
          # CPU-only torch keeps the download small (~250 MB vs ~2 GB for CUDA)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "ray[rllib]"

      - name: Run RLlib integration tests (PPO + action masking + live server)
        env:
          UNCIV_RL_URL: http://localhost:8080
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest rl_env/tests/test_rllib.py -v \
            -k "TestRLlibTraining or TestActionMaskingRLModule or TestUncivMacroWrapper"

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) 2>/dev/null || true
          fi
