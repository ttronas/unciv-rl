name: RL Integration Tests

on:
  push:
  pull_request:

jobs:
  rl-integration-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build server JAR
        run: ./gradlew server:dist

      # Two independent JVM servers – one per EnvRunner.
      # EnvRunner 0 (worker_index=1) → port 8080
      # EnvRunner 1 (worker_index=2) → port 8081
      - name: Start RL server for EnvRunner 0 (port 8080)
        working-directory: android/assets
        run: |
          java -jar ../../server/build/libs/UncivServer.jar --rl -no-auth -no-chat -p 8080 &
          echo $! > /tmp/server0.pid

      - name: Start RL server for EnvRunner 1 (port 8081)
        working-directory: android/assets
        run: |
          java -jar ../../server/build/libs/UncivServer.jar --rl -no-auth -no-chat -p 8081 &
          echo $! > /tmp/server1.pid

      - name: Wait for both servers to be ready
        run: |
          for port in 8080 8081; do
            echo "Waiting for server on port $port..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:$port/isalive > /dev/null; then
                echo "Server on port $port is ready after $i attempts"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "Server on port $port did not become ready in time"
                exit 1
              fi
              sleep 2
            done
          done

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pettingzoo gymnasium numpy requests pytest ray

      - name: Run integration tests
        env:
          # Primary server URL (used by TestRayParallelWorkers and others)
          UNCIV_RL_URL: http://localhost:8080
          # Two server URLs for EnvRunner-isolation tests.
          # Routing: worker_index % len(urls)
          #   worker_index=1 → urls[1] (8081)
          #   worker_index=2 → urls[0] (8080)
          UNCIV_RL_URLS: http://localhost:8080,http://localhost:8081
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest rl_env/tests/ -v

      - name: Stop servers
        if: always()
        run: |
          for pid_file in /tmp/server0.pid /tmp/server1.pid; do
            if [ -f "$pid_file" ]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done
