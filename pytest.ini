[pytest]
filterwarnings =
    # pettingzoo api_test warns when obs/mask are not plain numpy arrays;
    # Dict observation spaces naturally produce dict observations, so these
    # warnings are expected and not actionable.
    ignore:Observation is not a NumPy array:UserWarning:pettingzoo
    ignore:Action mask is not a NumPy array:UserWarning:pettingzoo
