# docker-compose.rl.yml – multi-server setup for distributed Ray RL training.
#
# Spins up four independent Unciv RL server instances, each on its own port
# (8080–8083).  Ray workers are sharded across these servers so that the JVM
# CPU load is spread across processes (see the "Distributed Training" section
# in docs/Developers/RL-Environment.md for the matching Python env_creator).
#
# Quick start:
#   docker compose -f docker-compose.rl.yml up --build -d
#
# Scale to a different number of servers by adding/removing service blocks
# and updating NUM_SERVERS in your env_creator accordingly.

version: "3.8"

x-rl-server: &rl-server
  build:
    context: .
    dockerfile: Dockerfile.rl-server
  restart: unless-stopped
  # Each container exposes 8080 internally; the host port is unique per service.

services:
  rl-server-0:
    <<: *rl-server
    ports:
      - "8080:8080"

  rl-server-1:
    <<: *rl-server
    ports:
      - "8081:8080"

  rl-server-2:
    <<: *rl-server
    ports:
      - "8082:8080"

  rl-server-3:
    <<: *rl-server
    ports:
      - "8083:8080"
